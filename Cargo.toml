[package]
name = "qrsend"
version = "0.1.0"
edition = "2021"
license = "ISC"
description = "Передача файлов с телефона на ПК по Wi-Fi через QR-код"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rand = "0.8"
qrcode = "0.14"
local-ip-address = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
eframe = "0.35"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
